apiVersion: apps/v1
kind: Deployment
metadata:
  name: logengine-api
  labels:
    app: logengine-api
spec:
  replicas: 3
  # Zero-downtime rollout: never drop below full capacity, allow one
  # extra pod while rolling.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  # A pod is only counted "available" (and unblocks the next surge/scale
  # down step) after it has been Ready for this long, not just the
  # instant it turns Ready.
  minReadySeconds: 5
  selector:
    matchLabels:
      app: logengine-api
  template:
    metadata:
      labels:
        app: logengine-api
    spec:
      # terminationGracePeriodSeconds must exceed preStop sleep +
      # SHUTDOWN_TIMEOUT (5s + 25s = 30s) or the kubelet SIGKILLs the
      # process before it finishes draining in-flight work. 40s leaves 10s
      # of headroom over that bound; at exactly 30s it merely met the bound,
      # so a slow final flush could be killed mid-write.
      terminationGracePeriodSeconds: 40
      containers:
        - name: api
          image: logengine-api:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: logengine-api-config
            - secretRef:
                name: logengine-api-secret
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Gives slow-starting pods (e.g. cold DB connection) up to
          # 60s (12 * 5s) before the liveness probe starts counting
          # against them.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          lifecycle:
            preStop:
              # Native Kubernetes sleep lifecycle handler (stable since
              # v1.32, apiVersion apps/v1 Pod spec). The API image is
              # gcr.io/distroless/static, which has no shell or `sleep`
              # binary, so an `exec` preStop hook (`sh -c "sleep 5"`)
              # cannot run inside this container. This gives the
              # endpoint controller time to remove the pod from Service
              # endpoints before SIGTERM is sent, so in-flight requests
              # routed just before shutdown still land on a live pod.
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
        # Sidecar: forwards/scrapes API logs+metrics over localhost.
        # Containers in the same pod share one network namespace (same
        # loopback interface, same port space), so the sidecar can reach
        # the api container at localhost:8080 without going through the
        # Service/ClusterIP. This is also why the api and log-forwarder
        # containers must not both try to bind the same port.
        - name: log-forwarder
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                wget -q -O- http://localhost:8080/healthz >/dev/null 2>&1 \
                  && echo "$(date -Iseconds) api reachable via localhost:8080 (shared pod network namespace)"
                sleep 15
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi

# Placeholder credentials for local/dev use only. In a real environment,
# generate this Secret out-of-band (sealed-secrets, external-secrets,
# vault-injector, etc.) rather than committing DATABASE_URL to git.
apiVersion: v1
kind: Secret
metadata:
  name: logengine-api-secret
  labels:
    app: logengine-api
type: Opaque
stringData:
  DATABASE_URL: "postgres://logengine:logengine@postgres:5432/logengine?sslmode=disable"
